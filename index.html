<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon.png" type="image/png" sizes="256x256" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#111827" />

    <!--
      Only site-wide constants belong here. Page-specific title, description, canonical,
      og:title/og:description/og:url and JSON-LD are declared per route in `head()` and
      injected by <HeadContent /> in __root.tsx.

      Duplicating them here actively hurt SEO: the generic copy appeared first in the
      document, so crawlers used it on every page and the per-route values were ignored.

      The title below is the pre-hydration fallback; HeadContent replaces it per route.
    -->
    <title>ENICE Group: Fintech and AI Products Built in Africa</title>

    <!-- Constant across every page, so safe to declare statically. -->
    <meta property="og:site_name" content="ENICE Group" />
    <meta property="og:image" content="https://enicehq.com/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@ENICEHQ" />
    <meta name="twitter:image" content="https://enicehq.com/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
