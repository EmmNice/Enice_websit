name: Deploy Supabase Edge Functions

# Manual by default so a deploy is always a deliberate act, with an automatic run when
# function code lands on main. Previously these functions had no deploy path at all —
# they had to be pushed by hand from a developer machine, which meant the repository and
# the running code could silently diverge.
on:
  workflow_dispatch:
    inputs:
      function:
        description: "Single function to deploy (blank = all)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Typecheck before deploying
        run: deno check --no-lock supabase/functions/*/index.ts

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::error::Set the SUPABASE_ACCESS_TOKEN and SUPABASE_PROJECT_REF repository secrets."
            exit 1
          fi
          if [ -n "${{ github.event.inputs.function }}" ]; then
            supabase functions deploy "${{ github.event.inputs.function }}" --project-ref "$PROJECT_REF"
          else
            supabase functions deploy --project-ref "$PROJECT_REF"
          fi
